name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check data/results.csv
        run: python scripts/validate.py
      - name: README table builds
        run: python scripts/build_readme.py
